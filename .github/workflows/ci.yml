name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: build / test / format (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore MapCue.sln

      - name: Build
        run: dotnet build MapCue.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MapCue.sln --configuration Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Format
        run: dotnet format MapCue.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: CLI smoke (no device, no TapCue, no LLM)
        run: |
          dotnet run --project src/MapCue.Cli --configuration Release --no-build -- --help
          dotnet run --project src/MapCue.Cli --configuration Release --no-build -- --version
          set +e
          dotnet run --project src/MapCue.Cli --configuration Release --no-build -- status
          code=$?
          set -e
          test "$code" -eq 3 || { echo "expected exit code 3 (not implemented), got $code"; exit 1; }

      - name: Graph import smoke (recorded Android snapshots, twice = same graph)
        run: |
          ws="$RUNNER_TEMP/mapcue-graph"
          first=$(dotnet run --project src/MapCue.Cli --configuration Release --no-build -- graph import tests/Fixtures/graph-import/android-settings-cycle.json --workspace "$ws")
          second=$(dotnet run --project src/MapCue.Cli --configuration Release --no-build -- graph import tests/Fixtures/graph-import/android-settings-cycle.json --workspace "$ws")
          echo "$first"; echo "$second"
          test "$(echo "$first" | grep '^graph ')" = "$(echo "$second" | grep '^graph ')"
          echo "$second" | grep -q 'new-states=0 new-variants=0 new-tasks=0 already-committed=2'
