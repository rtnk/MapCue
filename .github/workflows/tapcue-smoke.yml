name: TapCue smoke

# STEP-02 evidence for the TapCue adapter (docs/handovers/STEP-02.md):
# - tapcue-cli: real TapCue 0.1.0 without a device (version, MCP handshake, template check-syntax, fixture drift).
# - android: Android emulator (API 34, KVM): list_devices -> launchApp Settings -> inspect_screen -> back ->
#   inspect_screen -> hierarchy -> test --test-output-dir, with timings and the MCP/CLI collision check (R-03).
# - ios: manual only (workflow_dispatch, macos-26): the same scenario on com.apple.Preferences (R-01).
on:
  pull_request:
    paths:
      - "src/MapCue.Adapters.TapCue/**"
      - "src/MapCue.Application/Ports/IDeviceAutomation.cs"
      - "tests/MapCue.Adapters.TapCue.*/**"
      - ".github/workflows/tapcue-smoke.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also run the iOS Simulator smoke on macos-26 (billed macOS minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tapcue-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  tapcue-cli:
    name: TapCue 0.1.0 without device (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Fetch TapCue (pinned SHA-256)
        run: echo "TAPCUE=$(tests/MapCue.Adapters.TapCue.Smoke/fetch-tapcue.sh "$RUNNER_TEMP/tapcue")" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build MapCue.sln --configuration Release

      - name: Generated flow templates pass tapcue check-syntax
        run: dotnet tests/MapCue.Adapters.TapCue.Smoke/bin/Release/net10.0/MapCue.Adapters.TapCue.Smoke.dll --tapcue "$TAPCUE" --out reports/templates --templates-only

      - name: mapcue doctor without a device (expects exit 4 and a working MCP handshake)
        run: |
          export PATH="$(dirname "$TAPCUE"):$PATH"
          set +e
          dotnet src/MapCue.Cli/bin/Release/net10.0/mapcue.dll doctor | tee reports/doctor.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 4 || { echo "expected exit 4 (no device), got $code"; exit 1; }
          grep -q '^PASS  tapcue.version ' reports/doctor.txt
          grep -q '^PASS  tapcue.mcp ' reports/doctor.txt

      - name: Recorded MCP fixture has not drifted (R-12)
        run: |
          python3 -I tests/MapCue.Adapters.TapCue.ContractTests/Fixtures/tapcue-0.1.0/record_mcp_fixture.py --tapcue "$TAPCUE" --out reports/mcp-no-device.jsonl
          diff -u tests/MapCue.Adapters.TapCue.ContractTests/Fixtures/tapcue-0.1.0/mcp-no-device.jsonl reports/mcp-no-device.jsonl

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tapcue-cli-reports
          path: reports
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Android emulator smoke (ubuntu, API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enable KVM
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::No KVM on this runner: the Android smoke is NOT RUN."
            echo "NOT RUN: no KVM on this runner, the emulator cannot start." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Fetch TapCue (pinned SHA-256)
        run: echo "TAPCUE=$(tests/MapCue.Adapters.TapCue.Smoke/fetch-tapcue.sh "$RUNNER_TEMP/tapcue")" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build MapCue.sln --configuration Release

      - name: Run the smoke on the emulator
        uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: tests/MapCue.Adapters.TapCue.Smoke/run-device-smoke.sh "$TAPCUE" reports/android com.android.settings back emulator-5554

      - name: Summary
        if: always()
        run: cat reports/android/smoke/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no smoke report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke-reports
          path: reports
          retention-days: 14
          if-no-files-found: warn

  ios:
    name: iOS Simulator smoke (macos-26, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require Apple silicon and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Fetch TapCue (pinned SHA-256)
        run: echo "TAPCUE=$(tests/MapCue.Adapters.TapCue.Smoke/fetch-tapcue.sh "$RUNNER_TEMP/tapcue")" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build MapCue.sln --configuration Release

      - name: Build the iOS Simulator driver
        run: |
          mkdir -p reports/ios
          start=$(date +%s)
          "$TAPCUE" driver-setup --simulator
          echo "driver-setup: $(( $(date +%s) - start )) s" | tee reports/ios/driver-setup.txt

      - name: Boot a simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")], reverse=True)
          print(next(d["udid"] for r in ios for d in devices[r] if d["name"].startswith("iPhone")))')"
          echo "simulator: $udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Run the smoke on the simulator
        run: tests/MapCue.Adapters.TapCue.Smoke/run-device-smoke.sh "$TAPCUE" reports/ios com.apple.Preferences scroll "$UDID"

      - name: Summary
        if: always()
        run: cat reports/ios/smoke/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no smoke report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke-reports
          path: reports
          retention-days: 14
          if-no-files-found: warn
