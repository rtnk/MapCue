# Setup of the "investor" test profile: fresh app state, profile picker, Home with the Investments tab.
appId: com.mapcue.demoapp
---
# Clean start to the profile picker. On the CI emulator the cold start after clearState sometimes never reaches the picker
# (Demo app run 41252379887: 30 s without screen.profile); the reset is idempotent and safe, so it is retried (R-14).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: "(.*/)?screen.profile"
          timeout: 30000
- tapOn:
    id: "(.*/)?profile.investor"
- extendedWaitUntil:
    visible:
      id: "(.*/)?screen.home"
    timeout: 15000
- assertVisible:
    id: "(.*/)?tab.accounts"
- assertVisible:
    id: "(.*/)?tab.settings"
- assertVisible:
    id: "(.*/)?tab.investments"
