# Setup of the "basic" test profile: fresh app state, profile picker, Home.
# Selectors match MAUI AutomationId: Android resource-id <package>:id/<AutomationId>, iOS accessibilityIdentifier.
# See ../expected-graph.md.
appId: com.mapcue.demoapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "(.*/)?screen.profile"
    timeout: 30000
- tapOn:
    id: "(.*/)?profile.basic"
- extendedWaitUntil:
    visible:
      id: "(.*/)?screen.home"
    timeout: 15000
- assertVisible:
    id: "(.*/)?tab.accounts"
- assertVisible:
    id: "(.*/)?tab.settings"
- assertNotVisible:
    id: "(.*/)?tab.investments"
