# Setup of the "basic" profile in the empty-accounts scenario: the accounts list has no rows.
appId: com.mapcue.demoapp
---
# Clean start to the profile picker. On the CI emulator the cold start after clearState sometimes never reaches the picker
# (Demo app run 41252379887: 30 s without screen.profile); the reset is idempotent and safe, so it is retried (R-14).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible:
            id: "(.*/)?screen.profile"
          timeout: 30000
- tapOn:
    id: "(.*/)?scenario.empty"
- tapOn:
    id: "(.*/)?profile.basic"
- extendedWaitUntil:
    visible:
      id: "(.*/)?screen.home"
    timeout: 15000
- tapOn:
    id: "(.*/)?tab.accounts"
- assertVisible:
    id: "(.*/)?screen.accounts"
- assertVisible:
    id: "(.*/)?accounts.empty"
- assertNotVisible: "Everyday account.*"
