# Example MapCue configuration (schema mapcue.config/1).
# Validated by `mapcue explore --config docs/examples/mapcue.example.yaml` and by MapCue.Cli.Tests.
# Unknown keys are errors. Omitted budgets use the safe defaults from docs/architecture.md §10.2.
schemaVersion: mapcue.config/1
workspace: .mapcue

# Required. MapCue refuses to start without both allowlists; only `test` environments exist.
allowlist:
  appIds:
    - com.example.mapcue.demo
  environments:
    - test
  deviceIds: []        # optional; empty = any device reported by TapCue
  profileIds: []       # optional; empty = all profiles below

budgets:
  maxDepth: 8
  maxScreens: 40         # per run: new screens of this run
  maxStates: 120         # per run: new states of this run
  maxActions: 300        # per run; a task is not started when its estimated actions do not fit
  maxDuration: 60m
  maxRetries: 2          # infrastructure only: interruptions before ActionDispatched, then the task fails
  maxListRowsPerTemplate: 2  # further rows of a list template are representedBy the first one
  uiSettleTimeout: 5s
  actionTimeout: 30s
  observeTimeout: 20s

agent:
  reasoner: rule-based   # rule-based (default: offline heuristics, no LLM) | cli (the agent CLI below); STEP-05
  runtime: container     # `local` additionally needs allowLocalExecution: true; no fallback between runtimes (ADR-0004)
  allowLocalExecution: false
  sendScreenshots: false # true is refused until screenshot redaction exists (P1)
  maxCalls: 100
  maxTokens: 1000000
  maxCostUsd: 5
  provider: claude       # agent CLI (`claude -p`); the only provider implemented in STEP-04
  containerEngine: docker
  # containerImage: registry.example/mapcue-agent@sha256:<digest>   # required for the container runtime; no default
  # containerNetwork: llm-egress                                     # optional; egress restriction is the network's job
  # model: <model id>                                                # optional; the CLI default otherwise
  timeout: 180s          # hard timeout per call; the process tree (and container) is killed
  # apiKey: secret://env/ANTHROPIC_API_KEY                           # reference only, passed to the agent by name

# Operator risk rules (STEP-04): matching elements get at least this risk class; rules never lower a risk.
policy:
  # STEP-07: a run never switches to another profile by default (deny): the other profiles' switchElements are account changes.
  # allow classifies them like any other element (the context's graph may then mix profiles).
  profileSwitch: deny
  riskRules:
    - name: blik
      riskClass: financial
      resourceId: com.example.mapcue.demo:id/blik
    - name: admin-tools
      riskClass: destructive
      resourceIdPattern: "^com\\.example\\.mapcue\\.demo:id/admin_"

# Screen identity (STEP-05): resource-id patterns of an element that names the screen (e.g. a MAUI AutomationId on the page
# title). Snapshots with different markers are never the same screen; the same marker is the same logical screen.
identity:
  screenHints:
    - ':id/screen\.[A-Za-z0-9_.-]+$'
  # STEP-07 (R-04): with screen hints, a snapshot of another context that differs from a known state by at most this many identity
  # tokens (same marker and state kind) is a profile variant of it, not a new state; 0 disables the rule.
  profileVariantMaxDelta: 2

# STEP-08: screen contracts. Off by default. After the exploration of a context, every state gets a full hierarchy (AnalyzeScreen, CLI
# `tapcue hierarchy`) and, on Android, a keyboard focus probe (AuditAccessibility: pressKey Tab up to maxTabPresses times, each a device
# action charged to budgets.maxActions). `mapcue contract build` turns them into versioned contracts; `mapcue a11y record` adds manual
# checks of the operator (docs/a11y-manual-protocol.md), the only way to assistiveVerified for screen readers.
contracts:
  analyzeScreens: true
  keyboardFocus: true
  maxTabPresses: 12

profiles:
  - profileId: basic
    platform: android
    appId: com.example.mapcue.demo
    environment: test
    dataIsolation: shared-readonly
    inputs:
      # Secrets are references only; values are read from the environment at execution time.
      username: secret://env/MAPCUE_DEMO_USER
      password: secret://env/MAPCUE_DEMO_PASSWORD
      email: generated:email
    capabilities: []
    # setupFlow: flows/setup-basic.yaml   # optional TapCue flow (relative to this file) from a clean start to the profile's
    #                                     # start state; without it `mapcue explore` starts the app with a plain launchApp
    scenario: default                     # STEP-07: test data scenario (part of the exploration context)
    locale: und                           # STEP-07: language tag of the app under this profile (part of the context)
    switchElements: [':id/profile_basic$']  # STEP-07: resource-id patterns that switch the app to this profile
  - profileId: investor
    platform: android
    appId: com.example.mapcue.demo
    environment: test
    dataIsolation: shared-readonly
    capabilities: [investments]           # guard hypotheses: elements named like a capability (tab.investments) are inferred guards
    switchElements: [':id/profile_investor$']

# TapCue integration (optional; the values below are the defaults). docs/tapcue-compatibility.md §8.
tapcue:
  executable: tapcue          # a name looked up on PATH or an explicit path; no built-in install locations
  supportedVersions: ["0.1.0"]
  allowUntestedVersion: false # true runs other versions, flagged untestedAdapter
  passEnvironment: []         # extra variable names for the TapCue process; MAESTRO_* are always refused (G-06)
  startupTimeout: 120s        # JVM start + MCP handshake; added once to the first device call of a session (driver install)
  fullObservation: shared     # shared | exclusive: close the MCP session while CLI hierarchy/test runs (R-03)
  checkGeneratedSyntax: true  # tapcue check-syntax once per generated flow shape
